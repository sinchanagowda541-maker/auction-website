<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Bidder's Choice</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-page {
            padding: 40px 0 60px;
            background: linear-gradient(180deg, rgba(240, 249, 255, 0.95), #ffffff 40%);
            min-height: calc(100vh - 80px);
        }
        .profile-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            align-items: start;
        }
        .profile-card,
        .profile-form-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            box-shadow: var(--shadow-sm);
        }
        .profile-card {
            padding: 28px;
            position: sticky;
            top: 24px;
        }
        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .profile-meta {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        .meta-row:last-child {
            border-bottom: none;
        }
        .meta-row span:first-child {
            color: var(--text-muted);
        }
        .profile-form-card {
            padding: 30px;
        }
        .section-title {
            margin-bottom: 18px;
        }
        .info-banner {
            background: #eef2ff;
            color: #3730a3;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-weight: 500;
        }
        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .readonly-input {
            background: #f8fafc !important;
        }
        @media (max-width: 900px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
            .profile-card {
                position: static;
            }
        }
        @media (max-width: 640px) {
            .field-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-gavel"></i> Bidder's Choice
            </a>
            <div class="nav-links" id="nav-links"></div>
            <button class="mobile-menu-btn" id="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <main class="profile-page">
        <div class="container">
            <div class="profile-layout">
                <aside class="profile-card">
                    <div class="avatar" id="profile-avatar"><i class="fas fa-user"></i></div>
                    <h2 id="profile-name">My Profile</h2>
                    <p class="text-muted" id="profile-email">Loading account details...</p>

                    <div class="profile-meta">
                        <div class="meta-row"><span>Role</span><strong id="profile-role">-</strong></div>
                        <div class="meta-row"><span>Phone</span><strong id="profile-phone-display">-</strong></div>
                        <div class="meta-row"><span>Address</span><strong id="profile-address-display">-</strong></div>
                    </div>
                </aside>

                <section class="profile-form-card">
                    <div class="section-title">
                        <h1>Profile Settings</h1>
                        <p class="text-muted">View and update your account information.</p>
                    </div>

                    <div class="info-banner">
                        <i class="fas fa-user-circle"></i> Profile details come from your signed-in account.
                    </div>

                    <form id="profile-form">
                        <div class="field-grid">
                            <div class="form-group full-width">
                                <label>Full Name</label>
                                <input type="text" id="prof-name" class="form-control readonly-input" disabled>
                            </div>
                            <div class="form-group full-width">
                                <label>Email Address</label>
                                <input type="email" id="prof-email" class="form-control readonly-input" disabled>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="tel" id="prof-phone" class="form-control" placeholder="E.g., +1 234 567 8900">
                            </div>
                            <div class="form-group">
                                <label>Default Address</label>
                                <input type="text" id="prof-address" class="form-control" placeholder="E.g., 123 Main St, City">
                            </div>
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" id="prof-dob" class="form-control" onchange="calculateAge()">
                            </div>
                            <div class="form-group">
                                <label>Age</label>
                                <input type="number" id="prof-age" class="form-control readonly-input" readonly>
                            </div>
                            <div class="form-group full-width">
                                <label>Gender</label>
                                <select id="prof-gender" class="form-control">
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <option value="prefer_not_to_say">Prefer not to say</option>
                                </select>
                            </div>
                        </div>

                        <div style="display:flex; gap:12px; margin-top: 24px; flex-wrap: wrap;">
                            <button type="submit" class="btn btn-primary">Save Profile Updates</button>
                            <a href="live-auctions.html" class="btn btn-outline">Back to Live Auctions</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/main.js"></script>
    <script>
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const user = getUser();

        async function loadProfile() {
            try {
                const data = await fetchAPI('/auth/me');

                document.getElementById('profile-name').innerText = data.name || 'My Profile';
                document.getElementById('profile-email').innerText = data.email || '';
                document.getElementById('profile-role').innerText = data.role || '-';
                document.getElementById('profile-phone-display').innerText = data.phone_number || 'Not provided';
                document.getElementById('profile-address-display').innerText = data.address || 'Not provided';

                document.getElementById('prof-name').value = data.name || '';
                document.getElementById('prof-email').value = data.email || '';
                document.getElementById('prof-phone').value = data.phone_number || '';
                document.getElementById('prof-address').value = data.address || '';
                document.getElementById('prof-age').value = data.age || '';
                document.getElementById('prof-gender').value = data.gender || '';

                if (data.date_of_birth) {
                    const dob = new Date(data.date_of_birth);
                    document.getElementById('prof-dob').value = dob.toISOString().split('T')[0];
                }

                const initials = (data.name || 'U')
                    .split(' ')
                    .map(part => part[0])
                    .join('')
                    .slice(0, 2)
                    .toUpperCase();
                document.getElementById('profile-avatar').innerHTML = initials;
            } catch (error) {
                showToast('Failed to load profile', 'error');
            }
        }

        function calculateAge() {
            const dobInput = document.getElementById('prof-dob').value;
            if (!dobInput) return;
            const dob = new Date(dobInput);
            const diffMs = Date.now() - dob.getTime();
            const ageDate = new Date(diffMs);
            document.getElementById('prof-age').value = Math.abs(ageDate.getUTCFullYear() - 1970);
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');

            try {
                btn.disabled = true;
                btn.innerText = 'Saving...';

                await fetchAPI('/auth/profile', {
                    method: 'PUT',
                    body: JSON.stringify({
                        phone_number: document.getElementById('prof-phone').value,
                        address: document.getElementById('prof-address').value,
                        date_of_birth: document.getElementById('prof-dob').value,
                        age: document.getElementById('prof-age').value,
                        gender: document.getElementById('prof-gender').value
                    })
                });

                showToast('Profile updated successfully!');
                await loadProfile();
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Save Profile Updates';
            }
        });

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
